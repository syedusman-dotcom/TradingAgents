# Value pipeline settings. Every key is optional; missing keys fall back to the
# defaults in value_pipeline/config.py.

universe:
  indexes: [sp500, sp400]
  # The screen's metrics (EBIT/EV, ROIC, Z-Score) don't describe these businesses.
  exclude_sectors: [Financials, Real Estate, Utilities]

filters:
  min_market_cap: 2000000000   # USD
  min_fscore: 6
  min_altman_z: 1.8
  require_positive_fcf: true
  min_interest_coverage: 4
  min_roic_worst_year: 0.08     # ROIC at least 8% in every year: stable quality, not one good year
  max_dilution_per_year: 0.03   # share count may grow at most 3% a year
  # max_accruals_ratio: 0.10    # (net income - operating cash flow) / average assets; off unless set
  # max_beneish_m: -1.78        # Beneish M-score above this is the likely-manipulator band; off unless set

screen:
  top_n: 10
  cache_days: 1           # daily reviews from 2026-11-05 need each day's prices (7 while weekly; the Nordnet-markets build adds a cheaper price refresh)
  throttle_seconds: 0.3   # pause between tickers, to stay polite to Yahoo
  normalize_years: 5      # rank on EBIT and ROIC averaged over up to this many years
  roic_cap: 1.0           # ROIC above 100% ranks as 100%, so asset-light outliers don't dominate

review:
  candidates: 5            # top screen candidates (not held) to analyse each review
  candidate_cooldown_days: 5  # a candidate reviewed this recently gives its place to the next one down the screen (daily reviews since 2026-11-05)
  analysts: [market, news, fundamentals]
  # Financial statements for the agents. yfinance: ~5 years with every line (debt,
  # interest, PP&E, buybacks, dividends). sec_edgar: ~20 years of top-line rows only.
  statement_vendor: yfinance
  cost_per_run: 2.0        # USD per TradingAgents run, for the estimate
  max_cost_per_review: 40.0
  # After the per-stock reviews, one deep-model call ranks every reviewed stock, proposes the
  # allocation and swaps, and names concentration risks; ACTIONS shows where it disagrees with
  # the rules (it can never buy a stock its own review rated Sell). false to skip it.
  committee: true

sizing:
  max_position_weight: 0.10   # never target more than 10% of the portfolio per stock
  min_holdings: 5             # equal weight assumes at least this many holdings
  overweight_size_factor: 0.5 # Overweight gets half the target size
  min_trade_amount: 25        # don't suggest buys smaller than this (USD)
  max_sector_weight: 0.30     # buys and adds stop at 30% of the portfolio in one sector
  lane_caps: {compounder: 0.30, inflection: 0}          # buys and adds stop at these shares per lane
  lane_size_factor: {compounder: 0.5, inflection: 0.5}  # a lane buy is this fraction of the target size
  # Lanes that buy and add on a Buy rating only; their Overweights are watched, not sized. The
  # 2026-10-24 backtest: compounder Buys (price <= 1.15x base, return >= 12%) beat SPY in 4 of 8
  # years by +10 points on average; compounder Overweights (1.25x, 10%) lost by 2.5 points.
  lane_buy_only: [compounder]

# Investment lanes beyond value (compounder, inflection) and the dislocation scan: where
# discovery looks, and how many candidates of each it adds to a review.
# Since 2026-10-24 the review is value plus strict compounder Buys: no inflection candidates (the
# backtest found inflection high-variance). Dislocation candidates were off from 2026-10-24 (flat
# over a year in the backtest, +14.5 pts over three) and back on from 2026-10-31 for the Q3
# earnings season; they are reviewed as value-lane names and still need the value bar to be bought.
lanes:
  themes: []                 # e.g. ["AI infrastructure", "grid equipment"]
  tickers: []                # names to always consider
  inflection_candidates: 0
  compounder_candidates: 2
  dislocation_candidates: 3  # quality names down 25%+ from the high (or 20%+ in a month), numbers intact

# The lane-rule backtest (python -m value_pipeline backtest): the screen's lane rules replayed on
# what was filed by each past cohort date, held for fixed terms, against SPY and the universe.
# backtest:
#   first_year: 2015       # first cohort year
#   last_year: 2024        # last cohort year (a cohort runs only once its one-year hold has ended)
#   cohort_day: "06-30"    # month-day of each cohort date; most December 10-Ks are filed by then
#   holds: [1, 3]          # holding terms in years, each reported separately
#   value_top_n: 30        # the value and Magic Formula rules take this many of the cohort's ranking
#   benchmark: SPY         # the index fund every basket is compared with (total return)

watch:
  # The weekly check flags a stock the agents rated Buy/Overweight once its price
  # is at least this far below their intrinsic value.
  buy_margin_of_safety: 0.30
  # A Buy rating older than this is stale (the facts may have changed) and is
  # not alerted on; the next review refreshes it.
  max_rating_age_days: 120

daily:
  enabled: true        # the weekday price check that re-reviews what changed
  scope: all           # since 2026-11-05: ideas that reach their entry price are re-reviewed the same morning, not left for Saturday
  max_reviews: 3       # re-reviews per day; the rest wait until tomorrow
  cooldown_days: 5     # skip a ticker reviewed this recently (EARNINGS and REACHED VALUE ignore it)
  big_move: 0.15       # a move this far from the last review's price triggers a re-review
  exclude: [000270.KS] # ideas never re-reviewed on weekdays (Korea is untradeable for this account)

superinvestors:
  # Concentrated value investors whose latest 13F holdings are shown beside the
  # screen and on stock pages, as a second opinion. Add or remove any SEC filer by
  # its CIK. Gotham (Greenblatt, CIK 0001510387) is left out on purpose: it holds
  # ~1,800 stocks, so a match says little.
  refresh_days: 7
  investors:
    - {name: "Berkshire (Buffett)", cik: "0001067983"}
    - {name: "Baupost (Klarman)", cik: "0001061768"}
    - {name: "Himalaya (Li Lu)", cik: "0001709323"}
    - {name: "Dalal Street (Pabrai)", cik: "0001549575"}
    - {name: "Gardner Russo & Quinn (Russo)", cik: "0000860643"}
    - {name: "Akre Capital (Akre)", cik: "0001112520"}
